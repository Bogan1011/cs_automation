{% extends "base.html" %}
{% block backdrop %}
<video class="bg-media" autoplay muted loop playsinline poster="/static/bg/poster.jpg" aria-hidden="true">
  <source src="/static/bg/background.mp4" type="video/mp4">
</video>
<div class="bg-shade" aria-hidden="true"></div>
{% endblock %}
{% block content %}
<form class="login card" method="post" action="/login">
  <div class="logo">{% include "_logo.html" %}</div>
  <h1>Sign in</h1>
  <p class="muted small" style="margin:-6px 0 4px">CS Command Centre</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <label>Username <input name="username" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button>Sign in</button>
</form>
{% endblock %}
{% block scripts %}<script>
document.documentElement.classList.add('has-video');
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('.bg-media')?.pause();
</script>{% endblock %}
